name: lifesci

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifesci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifesci}
      POSTGRES_DB: ${POSTGRES_DB:-lifesci}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lifesci}:${POSTGRES_PASSWORD:-lifesci}@db:5432/${POSTGRES_DB:-lifesci}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1000}
      REQUEST_DEADLINE_SECONDS: ${REQUEST_DEADLINE_SECONDS:-45}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      STORAGE_DIR: /data/storage
      CORPUS_DIR: /data/lifesci-test-data
    volumes:
      - doc-storage:/data/storage
      # Only knowledge-base content is mounted; evals/ and adversarial-documents/ stay out.
      - ./lifesci-test-data/sample-documents:/data/lifesci-test-data/sample-documents:ro
      - ./lifesci-test-data/manifest.json:/data/lifesci-test-data/manifest.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  doc-storage:
