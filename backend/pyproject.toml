[project]
name = "lifesci-backend"
version = "0.1.0"
description = "LifeSci Intelligence API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "openai==3.58.0",
    "pgvector==0.5.1",
    "pymupdf==1.28.2",
    "python-multipart==0.0.34",
    "langsmith==0.14.17",
    "langgraph==1.2.20",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL with pgvector (TEST_DATABASE_URL)",
    "security: uses adversarial fixtures from lifesci-test-data/adversarial-documents",
]
addopts = "-ra"
