# Lint, typecheck, unit + integration tests, builds and a browser smoke test.
# Offline only: fake model providers, no secrets, LangSmith off. Actions are pinned to
# release commit SHAs (tag in the trailing comment; SHAs resolved from the tags with
# `git ls-remote` on 2026-11-24).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every main commit keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MODEL_PROVIDER: fake
  TRACE_LANGSMITH: "false"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: lifesci
          POSTGRES_PASSWORD: lifesci
          POSTGRES_DB: lifesci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifesci -d lifesci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lifesci:lifesci@127.0.0.1:5432/lifesci_test
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Unit, integration (pgvector service), security fixtures and the offline eval harness.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the Compose stack (fake providers)
        run: docker compose up --build --wait
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: frontend
        run: npm run test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color api web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v
